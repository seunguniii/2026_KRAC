# 미션 3단계: following_flight가 끝난 자리에서 10 m 상공으로 상승
#
# forward/right = 0 이라 수평으로는 움직이지 않고 제자리에서 올라간다.
# alt 는 EKF 원점(이륙 지점) 기준 절대 고도라, following_flight가 4 m에서
# 인계하고 끝났더라도 정확히 10 m 상공이 된다.

waypoint_flight:
  ros__parameters:
    waypoints: [
       0.0,  0.0, 10.0,
    ]

    accept_radius: 0.7
    hold_need:     20
    origin_need:   10
    exit_when_done: true
    handover_to_position: true
